
name: Update JSON and M3U

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Worker Response
        run: |
          curl -L --fail \
          "https://lemajekaat.streamxlive.workers.dev/" \
          -o response.json

      - name: Validate JSON
        run: |
          python -m json.tool response.json > playlist.json

      - name: Generate M3U
        run: |
          python - <<'PY'
          import json

          with open("playlist.json", encoding="utf-8") as f:
              data = json.load(f)

          channels = data if isinstance(data, list) else data.get("channels", [])

          lines = ["#EXTM3U"]

          for ch in channels:
              if not isinstance(ch, dict):
                  continue

              name = ch.get("name") or ch.get("title")
              url = ch.get("url") or ch.get("stream_url")

              if name and url:
                  lines.append(f'#EXTINF:-1,{name}')
                  lines.append(url)

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json playlist.m3u
          git diff --cached --quiet || git commit -m "Update JSON and M3U"
          git push
          
