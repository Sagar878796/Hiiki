name: Update M3U Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download playlist
        run: |
          curl -L --fail --retry 3 \
            "https://jiostbplus.saregojo99.workers.dev/m3u" \
            -o playlist.m3u
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}

      - name: Validate playlist
        run: |
          if ! grep -q "#EXTM3U" playlist.m3u; then
            echo "Invalid M3U playlist"
            exit 1
          fi

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Update playlist"
          git push
