
name: Update SDTV JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Worker Data
        run: |
          curl -L --fail \
          "https://lemajekaat.streamxlive.workers.dev/" \
          -o response.json

      - name: Validate JSON
        run: |
          python -m json.tool response.json > playlist.json

      - name: Save JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git diff --cached --quiet || git commit -m "Update playlist JSON"
          git push
          
